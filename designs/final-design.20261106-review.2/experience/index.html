<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>墨刃·孤行 · 交互设计</title><link rel="stylesheet" href="../ui/theme.css"><style>
*{box-sizing:border-box}html,body{margin:0;background:#102f35;color:#f4edda;font-family:DesignText,"PingFang SC",sans-serif}body{height:100svh;overflow:hidden}.review-bar{height:48px;padding:2px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:780px;margin:auto;font-size:13px}.review-bar button,.review-tools button,.review-tools select{font:inherit;min-height:44px;padding:7px 12px;background:#e9e5d8;color:#1d3436;border:1px solid #b99c60;border-radius:2px;cursor:pointer}.review-bar a{color:#e8d4a4;text-underline-offset:4px}.phone{position:relative;width:min(100vw,480px);height:100svh;margin:auto;overflow:hidden;background:#839482;isolation:isolate}.phone canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.screen-layer{position:absolute;inset:0;pointer-events:none}.review-tools{position:relative;font-size:14px}.review-tools summary{cursor:pointer;min-height:44px;display:grid;place-items:center;color:#e8d4a4;list-style:none;white-space:nowrap}.review-tools summary::-webkit-details-marker{display:none}.review-panel{position:fixed;right:8px;top:50px;width:min(310px,calc(100vw - 16px));max-height:calc(100svh - 65px);overflow:auto;z-index:90;background:#173d44;padding:16px;border:1px solid #7d9690}.review-tools p{line-height:1.7}.review-tools select{width:100%;margin:10px 0}.review-tools a{color:#ead6aa}.review-tools button{margin:4px 4px 4px 0}.review-tools .note{font-size:12px;color:#d3dbce}.live-note{position:fixed;left:50%;top:62px;bottom:auto;transform:translateX(-50%);background:#e9e5d8;color:#1d3436;padding:10px 15px;max-width:90vw;box-shadow:0 7px 18px #102d3540;z-index:100;font-size:14px}.live-note:empty{display:none}@media(min-width:900px){.phone{width:min(480px,calc(100svh*.5625))}}.review-bar{gap:10px}.review-bar>span{font-size:12px;margin-right:auto;white-space:nowrap}.review-bar button{white-space:nowrap}.review-bar a{white-space:nowrap;min-height:44px;display:inline-flex;align-items:center}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #e8c26f;outline-offset:3px}::selection{background:#c4a05b;color:#15353a}
.review-bar{display:none}.review-mode .review-bar{display:flex}.review-mode .phone{height:calc(100svh - 48px)}.review-tools:not([open]) .review-panel{display:none}@media(min-width:900px){.review-mode .phone{width:min(480px,calc((100svh - 48px)*.5625))}}
</style></head><body><header class="review-bar"><span>设计演示 · 模拟状态</span><button id="next-beat" type="button">下一幕</button><a href="../review.html">设计说明</a><details class="review-tools" id="review-tools"><summary>情景</summary><div class="review-panel"><p>从营地亲手走完整旅程，也可单独检查分支。战斗、钱包、奖励均为设计演示样本。</p><p class="note" id="scenario-description"></p><label for="scene-picker">跳转画面</label><select id="scene-picker"></select><button data-review="empty">资源不足</button><button data-review="full">六槽已满</button><button data-review="max">修行满级</button><button data-review="saveError">保存失败</button><button data-review="saveConflict">存档冲突</button><button data-review="loadError">加载失败</button><button data-review="adCancelled">激励取消</button><button data-review="adError">激励失败</button><button data-review="victory">首通结算</button><button data-review="repeatVictory">重复通卷</button><button data-review="finalPrepare">终前整备</button><button data-review="defeat">失败分支</button><button data-review="reset">重置设计情景</button><label for="operation-picker">资源／伙伴固定前提（载入会明确重置本页设计档）</label><select id="operation-picker"></select><button id="load-operation-sample">载入所选独立档</button><p class="note">只认可左右跑扫源。本版可全向拖动、停后侧向对近敌，未制作八向完整动作。人物位置只供表现，不判断碰撞或伤害。所有状态只在本页内存，不读写设备档案。</p></div></details></header><main class="phone" id="phone"><canvas id="world" aria-label="可拖动的山道表现设计"></canvas><div id="screen-layer" class="screen-layer"></div></main><div id="live-note" class="live-note" role="status"></div><script data-design-public-base>window.DESIGN_SHARED_BASE=new URL("../shared/",location.href).href;</script><script>if(new URLSearchParams(location.search).get('review')==='1')document.body.classList.add('review-mode');if(!location.hostname.match(/^(127\.0\.0\.1|localhost)$/))window.DESIGN_SHARED_BASE=new URL('../shared/',location.href).href;document.querySelector('#scene-picker').addEventListener('change',()=>document.querySelector('#review-tools').open=false);document.querySelector('#review-tools').addEventListener('click',e=>{if(e.target.closest('[data-review]'))document.querySelector('#review-tools').open=false;});</script><script src="../ui/screens.js"></script><script src="world.js"></script><script src="app.js"></script></body></html>
