name: Publish test previews
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: test-preview-pages-v2
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload static test history
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy test history
        id: deployment
        uses: actions/deploy-pages@v5
